server:
  listen: 172.19.116.45:6624
  request_timeout_seconds: 180
  stream_idle_timeout_seconds: 30
  queue_max_depth: 8
  queue_wait_timeout_seconds: 30
  max_upload_bytes: 52428800
  temp_directory: /home/kevin/.local/state/openai-speech-server/tmp
  ffmpeg: /usr/bin/ffmpeg
  prlimit: /usr/bin/prlimit
  ffmpeg_memory_bytes: 2147483648
  normalization_timeout_seconds: 60
  shutdown_grace_seconds: 30
  metrics_enabled: true
  # These existing settings are published in each authorized transcription
  # model's capabilities.realtime object. Clients use them before recording.
  realtime:
    max_buffer_bytes: 5760000 # 120 seconds of 24 kHz mono s16le; lower model duration applies, rounded down to two bytes
    max_message_bytes: 1048576
    max_output_bytes: 1048576
    idle_timeout_seconds: 60
    max_session_seconds: 3600 # Measured from the upgraded session's start

auth:
  tokens_file: /home/kevin/.config/openai-speech-server/tokens.json

# Optional recognition corrections; restart the server after changing them.
# Set default_rule_set to vocabulary to enable these rules for ALL clients.
# No per-client configuration is needed to inherit the default.
transcription_substitutions:
  default_rule_set: null
  rule_sets:
    vocabulary:
      - id: app-name
        pattern: '\b(?:seedes|seedus|sedus)\b'
        replacement: 'Sedes'
        case_insensitive: true

# Optional pronunciation adjustments; restart after changing them.
# Set default_rule_set to pronunciation to enable these rules for ALL clients.
# These rules change only synthesis input, leaving clients' displayed text intact.
# Audition replacements with your chosen voice; pronunciation is engine-dependent.
speech_substitutions:
  default_rule_set: null
  rule_sets:
    pronunciation:
      - id: merge-request
        pattern: '\bMR\b'
        replacement: 'M. R.'
        case_insensitive: false

models:
  - id: parakeet-local
    display_label: Parakeet TDT CTC 110M
    default: true
    task: transcription
    provider: parakeet
    enabled: true
    required: true
    input_formats: [wav, webm, ogg, mp4, mp3]
    language_auto_detect: true
    supports_prompt: false
    # Optional existing model bound, also applied to capabilities.realtime.max_buffer_bytes:
    # max_duration_seconds: 120
    provider_config:
      python: /home/kevin/.venvs/parakeet/bin/python
      checkpoint: nvidia/parakeet-tdt_ctc-110m
      device: auto
      workers: 1
      cancel_grace_seconds: 300
      warmup_timeout_seconds: 600
  - id: kokoro-local
    display_label: Kokoro
    default: true
    task: speech
    provider: kokoro
    enabled: true
    required: true
    default_voice: af_heart
    voices: [af_heart, af_sky]
    output_formats: [pcm, wav]
    speed: { min: 0.5, max: 2.0, default: 1.0 }
    sample_rate: 24000
    channels: 1
    encoding: pcm_s16le
    max_text_length: 4096
    provider_config:
      python: /home/kevin/.venvs/kokoro/bin/python
      device: auto
      workers: 1
      cancel_grace_seconds: 5
      warmup_timeout_seconds: 600
      options:
        lang_code: a

clients:
  - id: t3-dev
    token_ref: t3-dev
    allowed_models: [parakeet-local, kokoro-local]
    max_concurrent_requests: 2
    # Optional independent exceptions: null disables that direction;
    # a set name replaces that direction's default. Omit to inherit the default.
    # transcription_rule_set: null
    # speech_rule_set: null
